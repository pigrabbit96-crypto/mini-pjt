<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 또래 인구 이동</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f6fde'/%3E%3Cpath d='M6 18V11M11 18V6M16 18v-5' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f0f2f5;
    --border: #e2e5ea;
    --text: #1b1f24;
    --muted: #5f6b7a;
    --accent: #2f6fde;
    --accent-soft: #e8f0fd;
    --accent-text: #ffffff;
    --ok: #1f7a4d;
    --ok-soft: #e4f4ec;
    --warn: #9a5b00;
    --warn-soft: #fdf1dc;
    --bad: #b42318;
    --bad-soft: #fdeceb;
    --code: #eef1f5;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --surface: #171b21;
      --surface-2: #1e232b;
      --border: #2a313b;
      --text: #e6e9ee;
      --muted: #97a1ae;
      --accent: #6b9cf5;
      --accent-soft: #1b2a45;
      --accent-text: #0f1216;
      --ok: #5cc995;
      --ok-soft: #15301f;
      --warn: #f0b45a;
      --warn-soft: #33270f;
      --bad: #f2867c;
      --bad-soft: #3a1714;
      --code: #222831;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* 머리글 */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .bar {
    max-width: 880px;
    margin: 0 auto;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; flex: none;
  }
  .title { flex: 1; min-width: 0; }
  .title h1 { margin: 0; font-size: 17px; line-height: 1.3; }
  .title p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .btn-ghost {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer;
    white-space: nowrap;
  }
  .btn-ghost:hover { background: var(--surface-2); }

  /* 대화 */
  main { flex: 1; overflow-y: auto; }
  .thread { max-width: 880px; margin: 0 auto; padding: 20px 16px 8px; }
  .welcome {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 22px 18px; box-shadow: var(--shadow);
  }
  .welcome h2 { margin: 0 0 6px; font-size: 18px; }
  .welcome p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13.5px; cursor: pointer;
    text-align: left;
  }
  .chip:hover { border-color: var(--accent); background: var(--accent-soft); }
  .scope { margin-top: 14px; font-size: 12.5px; color: var(--muted); }

  .msg { margin: 18px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble-user {
    background: var(--accent); color: var(--accent-text);
    padding: 10px 14px; border-radius: 14px 14px 4px 14px; max-width: 80%;
    white-space: pre-wrap; word-break: break-word;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); width: 100%; overflow: hidden;
  }
  .card.error { border-color: var(--bad); }
  .card-body { padding: 16px 18px 6px; overflow-x: auto; }
  .card-foot {
    border-top: 1px solid var(--border); padding: 10px 18px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    font-size: 12.5px; color: var(--muted);
  }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600;
  }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge.neutral { background: var(--surface-2); color: var(--muted); }
  .spacer { flex: 1; }
  .toggle {
    border: 0; background: none; color: var(--accent); font: inherit; font-size: 12.5px;
    cursor: pointer; padding: 2px 0;
  }

  /* 답변 본문 */
  .md > :first-child { margin-top: 0; }
  .md h3 { font-size: 16px; margin: 18px 0 8px; }
  .md h4 { font-size: 15px; margin: 16px 0 6px; }
  .md p { margin: 0 0 10px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
  .md blockquote {
    margin: 0 0 10px; padding: 8px 12px; border-left: 3px solid var(--accent);
    background: var(--accent-soft); border-radius: 0 8px 8px 0;
  }
  .md blockquote p:last-child { margin-bottom: 0; }
  .md code { background: var(--code); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .md pre {
    background: var(--code); border-radius: 8px; padding: 10px 12px; overflow-x: auto;
    font-size: 13px; margin: 0 0 10px; white-space: pre-wrap;
  }
  .md table { border-collapse: collapse; margin: 0 0 12px; font-size: 14px; min-width: 50%; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .md th { background: var(--surface-2); font-weight: 600; }
  .md td.num, .md th.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* 근거 패널 */
  .detail { border-top: 1px solid var(--border); background: var(--surface-2); padding: 12px 18px 14px; display: none; }
  .detail.open { display: block; }
  .detail h5 { margin: 10px 0 6px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .detail h5:first-child { margin-top: 0; }
  .step {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; margin-bottom: 8px; font-size: 13px;
  }
  .step b { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; }
  .step pre, .ctx pre {
    margin: 6px 0 0; font-size: 12px; max-height: 260px; overflow: auto;
    background: var(--code); padding: 8px; border-radius: 6px; white-space: pre-wrap; word-break: break-word;
  }
  .ctx { font-size: 13px; }
  .ctx details { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; margin-bottom: 6px; }
  .ctx summary { cursor: pointer; }

  /* 대기 */
  .pending { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; padding: 14px 18px; }
  .dots span {
    display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%;
    background: var(--accent); animation: blink 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: .7; } }

  /* 입력창 */
  footer { background: var(--surface); border-top: 1px solid var(--border); }
  .composer { max-width: 880px; margin: 0 auto; padding: 12px 16px 14px; }
  .box {
    display: flex; gap: 8px; align-items: flex-end;
    border: 1px solid var(--border); border-radius: 12px; background: var(--bg); padding: 8px;
  }
  .box:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--text);
    font: inherit; line-height: 1.5; max-height: 160px; padding: 4px 6px;
  }
  .send {
    border: 0; border-radius: 9px; background: var(--accent); color: var(--accent-text);
    font: inherit; font-weight: 600; padding: 8px 16px; cursor: pointer;
  }
  .send:disabled { opacity: .45; cursor: default; }
  .hint { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; gap: 12px; }

  @media (max-width: 600px) {
    .title p { display: none; }
    .bubble-user { max-width: 92%; }
    .card-body { padding: 14px 14px 4px; }
    .card-foot, .detail { padding-left: 14px; padding-right: 14px; }
    .hint .keys { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    </div>
    <div class="title">
      <h1>내 또래 인구 이동</h1>
      <p>2021~2025년 시도별·연령별 주민등록 인구 (각 12월 말 기준)</p>
    </div>
    <button class="btn-ghost" id="reset" type="button" title="이전 대화를 잊고 새로 시작합니다">새 대화</button>
  </div>
</header>

<main id="scroller">
  <div class="thread" id="thread">
    <section class="welcome" id="welcome">
      <h2>내 또래는 5년 동안 어떻게 됐을까요?</h2>
      <p>출생연도와 지역으로 물어보세요. 같은 대화에서 "그럼 서울은?"처럼 이어서 물을 수 있습니다.</p>
      <div class="chips" id="chips"></div>
      <div class="scope">시도 단위, 성별 구분 없는 데이터입니다. 시군구·성별·장래 예측은 다루지 않습니다.</div>
    </section>
  </div>
</main>

<footer>
  <form class="composer" id="form">
    <div class="box">
      <textarea id="q" rows="1" maxlength="1000" placeholder="예: 1998년생 전남 또래는 5년 동안 어떻게 됐어?" aria-label="질문"></textarea>
      <button class="send" id="send" type="submit" disabled>보내기</button>
    </div>
    <div class="hint">
      <span class="keys">Enter 보내기 · Shift+Enter 줄바꿈</span>
      <span id="count">0 / 1000</span>
    </div>
  </form>
</footer>

<script>
(() => {
  "use strict";

  const EXAMPLES = [
    "1998년생 전남 또래는 5년 동안 어떻게 됐어?",
    "그럼 서울은?",
    "2025년 서울 30대 인구는 몇 명이야?",
    "나 지금 27살인데 내 또래들 서울로 많이 갔어?",
    "국내 순변화 추정은 어떻게 계산하는 거야?",
  ];
  const STEP_NUMBERS = "숫자 검증";
  const STEP_ROUTES = "이동 경로 표현 점검";

  const $ = (id) => document.getElementById(id);
  const thread = $("thread"), scroller = $("scroller"), form = $("form");
  const input = $("q"), send = $("send"), count = $("count");
  let sessionId = newSessionId();
  let busy = false;

  function newSessionId() {
    if (window.crypto && crypto.randomUUID) return "web-" + crypto.randomUUID();
    return "web-" + Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  // ------------------------------------------------------------ 마크다운 (답변 표시용 최소 구현)
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  }

  // '$$ ... $$' 수식은 읽을 수 있는 글자로 바꿔 보여 준다.
  function plainMath(s) {
    return s.replace(/\{,\}/g, ",")
      .replace(/\\mathbf\{([^{}]*)\}/g, "$1")
      .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, "$1 ÷ $2")
      .replace(/\\(?:bigl|bigr|Bigl|Bigr|left|right)/g, "")
      .replace(/\\times/g, "×").replace(/\\%/g, "%").replace(/\\ /g, " ")
      .replace(/[{}]/g, "").trim();
  }

  const isTableSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
  const looksNumeric = (c) => /^[*\s]*[+\-−]?[\d,]+(\.\d+)?\s*(명|%p|%)?[*\s]*$/.test(c);

  function md(src) {
    const lines = src.replace(/\r/g, "").split("\n");
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const t = line.trim();
      if (!t) { i++; continue; }

      if (t.startsWith("$$")) {
        let body = t.slice(2);
        if (body.endsWith("$$")) { body = body.slice(0, -2); i++; }
        else { i++; while (i < lines.length && !lines[i].trim().endsWith("$$")) body += " " + lines[i++].trim(); if (i < lines.length) body += " " + lines[i++].trim().slice(0, -2); }
        out.push("<pre>" + esc(plainMath(body)) + "</pre>");
        continue;
      }
      if (t.startsWith("```")) {
        const buf = []; i++;
        while (i < lines.length && !lines[i].trim().startsWith("```")) buf.push(lines[i++]);
        i++;
        out.push("<pre>" + esc(buf.join("\n")) + "</pre>");
        continue;
      }
      const h = t.match(/^(#{1,6})\s+(.*)$/);
      if (h) { out.push(h[1].length <= 2 ? `<h3>${inline(h[2])}</h3>` : `<h4>${inline(h[2])}</h4>`); i++; continue; }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { out.push("<hr>"); i++; continue; }
      if (t.startsWith(">")) {
        const buf = [];
        while (i < lines.length && lines[i].trim().startsWith(">")) buf.push(lines[i++].trim().replace(/^>\s?/, ""));
        out.push("<blockquote>" + md(buf.join("\n")) + "</blockquote>");
        continue;
      }
      if (t.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        const head = cells(t); i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim().includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));
        const numCol = head.map((_, c) => rows.length > 0 && rows.every((r) => !r[c] || looksNumeric(r[c])));
        let html = "<table><thead><tr>" + head.map((c, k) => `<th${numCol[k] ? ' class="num"' : ""}>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
        for (const r of rows) html += "<tr>" + head.map((_, k) => `<td${numCol[k] ? ' class="num"' : ""}>${inline(r[k] || "")}</td>`).join("") + "</tr>";
        out.push(html + "</tbody></table>");
        continue;
      }
      const li = /^\s*(?:[-*+]|\d+\.)\s+/;
      if (li.test(line)) {
        const ordered = /^\s*\d+\./.test(line);
        const items = [];
        while (i < lines.length && (li.test(lines[i]) || (lines[i].trim() && /^\s{2,}/.test(lines[i]) && items.length))) {
          if (li.test(lines[i])) items.push(lines[i].replace(li, ""));
          else items[items.length - 1] += " " + lines[i].trim();
          i++;
        }
        const tag = ordered ? "ol" : "ul";
        out.push(`<${tag}>` + items.map((x) => `<li>${inline(x)}</li>`).join("") + `</${tag}>`);
        continue;
      }
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|>|```|\$\$|(-{3,}|\*{3,})$)/.test(lines[i].trim()) && !li.test(lines[i])
             && !(lines[i].includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1]))) {
        buf.push(inline(lines[i++].trim()));
      }
      out.push("<p>" + buf.join("<br>") + "</p>");
    }
    return out.join("");
  }

  // ------------------------------------------------------------ 화면 조각
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function scrollDown() { scroller.scrollTop = scroller.scrollHeight; }

  function addUser(text) {
    $("welcome")?.remove();
    const row = el("div", "msg user");
    const b = el("div", "bubble-user"); b.textContent = text;
    row.append(b); thread.append(row); scrollDown();
  }

  function addPending() {
    const row = el("div", "msg");
    const card = el("div", "card");
    const p = el("div", "pending", '<span class="dots"><span></span><span></span><span></span></span><span class="label">도구로 계산하고 답을 확인하는 중</span>');
    card.append(p); row.append(card); thread.append(row); scrollDown();
    const started = Date.now();
    const label = p.querySelector(".label");
    const timer = setInterval(() => { label.textContent = `도구로 계산하고 답을 확인하는 중 · ${Math.floor((Date.now() - started) / 1000)}초`; }, 1000);
    return { row, done: () => clearInterval(timer), secs: () => ((Date.now() - started) / 1000).toFixed(1) };
  }

  function badgeFor(step, name) {
    if (!step) return null;
    const result = step["결과"];
    const rewrote = step["재작성 요청"];
    let cls = "neutral", text = `${name} ${result ?? ""}`.trim();
    if (result === "통과") { cls = rewrote ? "warn" : "ok"; text = rewrote ? `${name} 통과 (다시 쓰기 1회)` : `${name} 통과`; }
    else if (result === "보류" || result === "오류" || result === "실패") cls = "bad";
    else if (result === "거절") cls = "warn";
    const b = el("span", "badge " + cls); b.textContent = text;
    const first = step["처음 확인되지 않은 숫자"] || step["처음 단정 표현"];
    if (first && first.length) b.title = "처음 답변에서 걸린 것: " + first.join(", ");
    return b;
  }

  function addAnswer(data, status, secs) {
    const trace = Array.isArray(data.trace) ? data.trace : [];
    const contexts = Array.isArray(data.contexts) ? data.contexts : [];
    const tools = trace.filter((t) => t["도구"]);
    const checks = Object.fromEntries(trace.filter((t) => !t["도구"]).map((t) => [t["단계"], t]));
    const failed = status !== 200 || ["오류", "실패"].includes((trace[0] || {})["결과"]);

    const row = el("div", "msg");
    const card = el("div", "card" + (failed ? " error" : ""));
    const body = el("div", "card-body md", md(data.answer || "응답에 답변이 없습니다."));
    const foot = el("div", "card-foot");

    if (failed) {
      const b = el("span", "badge bad"); b.textContent = status ? `오류 (HTTP ${status})` : "연결 실패"; foot.append(b);
      const step = trace[0];
      if (step && step["오류 종류"]) foot.append(document.createTextNode(step["오류 종류"]));
    } else {
      for (const [key, name] of [[STEP_NUMBERS, "숫자 검증"], [STEP_ROUTES, "표현 점검"]]) {
        const b = badgeFor(checks[key], name); if (b) foot.append(b);
      }
      const used = el("span"); used.textContent = tools.length ? "도구: " + [...new Set(tools.map((t) => t["도구"]))].join(", ") : "도구 호출 없음";
      foot.append(used);
    }
    foot.append(el("span", "spacer"));
    if (secs) { const s = el("span"); s.textContent = `${secs}초`; foot.append(s); }

    const detail = el("div", "detail");
    if (tools.length || contexts.length || trace.length) {
      const btn = el("button", "toggle"); btn.type = "button"; btn.textContent = "근거 보기";
      btn.addEventListener("click", () => {
        const open = detail.classList.toggle("open");
        btn.textContent = open ? "근거 접기" : "근거 보기";
        if (open && !detail.childElementCount) fillDetail(detail, tools, contexts, trace);
      });
      foot.append(btn);
    }

    card.append(body, foot, detail); row.append(card); thread.append(row);
    row.scrollIntoView({ block: "start", behavior: "smooth" });
  }

  function fillDetail(box, tools, contexts, trace) {
    const pretty = (v) => esc(typeof v === "string" ? v : JSON.stringify(v, null, 2));
    if (tools.length) {
      box.append(el("h5", null, "도구 호출"));
      for (const t of tools) {
        const s = el("div", "step", `<b>${esc(String(t["도구"]))}</b> ${esc(JSON.stringify(t["입력"] || {}))}`);
        const d = el("details"); d.append(el("summary", null, "결과 보기"), el("pre", null, pretty(t["출력"])));
        s.append(d); box.append(s);
      }
    }
    const guides = contexts.filter((c) => typeof c === "string" && c.trim().startsWith("#"));
    if (guides.length) {
      box.append(el("h5", null, "참고한 설명 문서"));
      const wrap = el("div", "ctx");
      for (const c of guides) {
        const title = c.trim().split("\n")[0].replace(/^#+\s*/, "");
        const d = el("details"); d.append(el("summary", null, esc(title)), el("pre", null, esc(c.trim())));
        wrap.append(d);
      }
      box.append(wrap);
    }
    const checks = trace.filter((t) => !t["도구"]);
    if (checks.length) {
      box.append(el("h5", null, "답변 검증 기록"));
      for (const c of checks) box.append(el("div", "step", `<pre>${pretty(c)}</pre>`));
    }
  }

  // ------------------------------------------------------------ 보내기
  async function ask(question) {
    if (busy) return;
    busy = true; updateSend();
    addUser(question);
    const pending = addPending();
    let data, status = 0;
    try {
      const res = await fetch("/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, session_id: sessionId }),
      });
      status = res.status;
      try { data = await res.json(); } catch { data = { answer: "서버 응답을 읽지 못했습니다.", contexts: [], trace: [] }; }
    } catch {
      data = { answer: "서버에 연결하지 못했습니다. 서버가 켜져 있는지 확인해 주세요.", contexts: [], trace: [] };
    }
    pending.done(); pending.row.remove();
    addAnswer(data, status, status ? pending.secs() : null);
    busy = false; updateSend(); input.focus();
  }

  function updateSend() {
    const len = input.value.trim().length;
    count.textContent = `${input.value.length} / 1000`;
    send.disabled = busy || len === 0;
  }

  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q || busy) return;
    input.value = ""; autosize(); updateSend();
    ask(q);
  });
  input.addEventListener("input", () => { autosize(); updateSend(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });

  const chips = $("chips");
  for (const q of EXAMPLES) {
    const c = el("button", "chip"); c.type = "button"; c.textContent = q;
    c.addEventListener("click", () => ask(q));
    chips.append(c);
  }
  const welcomeHtml = $("welcome").outerHTML;

  $("reset").addEventListener("click", () => {
    if (busy) return;
    sessionId = newSessionId();
    thread.innerHTML = welcomeHtml;
    const box = $("chips"); box.innerHTML = "";
    for (const q of EXAMPLES) {
      const c = el("button", "chip"); c.type = "button"; c.textContent = q;
      c.addEventListener("click", () => ask(q));
      box.append(c);
    }
    input.focus();
  });

  updateSend();
  input.focus();
})();
</script>
</body>
</html>
